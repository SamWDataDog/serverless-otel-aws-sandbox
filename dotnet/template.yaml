AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Round 5: .NET parity for the two OTel Lambda modes tested throughout this
  repo. Mode 1 (OtelSandboxDotnetFunction) is ported, with attribution, from
  https://github.com/SiddhithaBhoopathy/otel-dotnet-lambda-extension-samples
  -- OTel SDK via the Datadog Extension's OTLP receiver, no Datadog tracing
  layer. Mode 2 (DdtraceOtelApiDotnetFunction) is native dd-trace-dotnet +
  the System.Diagnostics.Activity bridge (DD_TRACE_OTEL_ENABLED=true), built
  fresh. See FINDINGS.md "Round 5".

Parameters:
  DatadogApiKey:
    Type: String
    NoEcho: true
    Description: Datadog API key. Pass at deploy time; do not commit a real key.
  DatadogSite:
    Type: String
    Default: datadoghq.com
    Description: Datadog site (datadoghq.com, datadoghq.eu, ...).
  ExtensionVersion:
    Type: String
    Default: "101"
    Description: Datadog-Extension layer version (Mode 1). Verified via aws lambda get-layer-version-by-arn, not assumed.
  DotnetTracerVersion:
    Type: String
    Default: "26"
    Description: dd-trace-dotnet layer version (Mode 2). Verified the same way.

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Architectures:
      - x86_64

Resources:
  OtelSandboxDotnetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: otel-aws-sandbox-dotnet
      Description: "Mode 1: OTel SDK via the Datadog Extension's OTLP receiver. No Datadog tracing layer."
      CodeUri: src/OtelSandboxDotnet/
      # The assembly (OtelSandboxDotnet, left of ::) and the namespace
      # (OtelStdoutSample, right of ::) intentionally differ -- the
      # namespace carries the identity of the ported sample this Mode 1
      # function is based on (see the Description above), while the
      # project/assembly was renamed to fit this repo's naming. If either
      # half is renamed in the future, this Handler string must be
      # updated to match, or the function breaks with a handler-not-found
      # error at invoke time, not at build time.
      Handler: OtelSandboxDotnet::OtelStdoutSample.Function::FunctionHandler
      Runtime: dotnet8
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Extension:${ExtensionVersion}
      Environment:
        Variables:
          DD_API_KEY: !Ref DatadogApiKey
          DD_SITE: !Ref DatadogSite
          DD_SERVICE: otel-aws-sandbox-dotnet
          DD_ENV: sandbox
          DD_SERVERLESS_LOGS_ENABLED: "true"
          DD_TRACE_ENABLED: "false"
          DD_OTLP_CONFIG_RECEIVER_PROTOCOLS_HTTP_ENDPOINT: localhost:4318
          OTEL_SERVICE_NAME: otel-aws-sandbox-dotnet
          OTEL_RESOURCE_ATTRIBUTES: service.name=otel-aws-sandbox-dotnet,deployment.environment=sandbox
          OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318
          OTEL_EXPORTER_OTLP_TRACES_PROTOCOL: http/protobuf
          OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://localhost:4318/v1/traces
      # This function calls sts:GetCallerIdentity (added for cross-language
      # parity, see Function.cs), which needs no IAM permission at all --
      # no Policies block here is intentional, same as every other
      # function in this repo that calls it. See DdtraceOtelApiDotnetFunction
      # below for the same note.
    Metadata:
      BuildMethod: dotnet8

  DdtraceOtelApiDotnetFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ddtrace-otel-api-sandbox-dotnet
      Description: "Mode 2: native dd-trace-dotnet + System.Diagnostics.Activity bridge (DD_TRACE_OTEL_ENABLED=true)."
      CodeUri: src/DdtraceOtelApiDotnet/
      Handler: DdtraceOtelApiDotnet::DdtraceOtelApiDotnet.Function::FunctionHandler
      Runtime: dotnet8
      Layers:
        - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:Datadog-Extension:${ExtensionVersion}
        - !Sub arn:aws:lambda:${AWS::Region}:464622532012:layer:dd-trace-dotnet:${DotnetTracerVersion}
      Environment:
        Variables:
          DD_API_KEY: !Ref DatadogApiKey
          DD_SITE: !Ref DatadogSite
          DD_SERVICE: ddtrace-otel-api-sandbox-dotnet
          DD_ENV: sandbox
          DD_TRACE_ENABLED: "true"
          DD_TRACE_OTEL_ENABLED: "true"
          AWS_LAMBDA_EXEC_WRAPPER: /opt/datadog_wrapper
      # sts:GetCallerIdentity needs no IAM permission at all (AWS grants
      # it unconditionally) -- no Policies block here is intentional, not
      # a gap. See the root README's Phase 2 item 10 note.
    Metadata:
      BuildMethod: dotnet8

  # AWS::Serverless::Function has no retention property of its own --
  # declaring the log group explicitly (same name Lambda would otherwise
  # auto-create) is the standard SAM/CloudFormation way to get CFN to
  # manage retention instead of leaving a never-expire group behind
  # after `sam delete`. Not verified against a live deploy.
  OtelSandboxDotnetLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${OtelSandboxDotnetFunction}
      RetentionInDays: 7

  DdtraceOtelApiDotnetLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${DdtraceOtelApiDotnetFunction}
      RetentionInDays: 7

Outputs:
  OtelSandboxDotnetFunctionName:
    Value: !Ref OtelSandboxDotnetFunction
  OtelSandboxDotnetLogGroup:
    Value: !Sub /aws/lambda/${OtelSandboxDotnetFunction}
  DdtraceOtelApiDotnetFunctionName:
    Value: !Ref DdtraceOtelApiDotnetFunction
  DdtraceOtelApiDotnetLogGroup:
    Value: !Sub /aws/lambda/${DdtraceOtelApiDotnetFunction}
